 class="reader-viewport"><img src="../assets/documents/pub-ageing/page-1.jpg" alt="Document page 1"></div></div></main><footer class="site-footer"><span>Shaoquan Wang</span><span>RESEARCH / ENGINEERING</span><a href="../index.html#about">BACK TO TOP</a></footer><dialog class="video-dialog" aria-label="Interview player"><button class="dialog-close">Close</button><video controls playsinline preload="none" tabindex="0"></video></dialog><script>(() => {
  const chinese=document.documentElement.lang==='zh-CN';
  const ui=(en,zh)=>chinese?zh:en;
  document.querySelector('[data-language-switch]')?.addEventListener('click',event=>{
    const link=event.currentTarget;
    link.hash='';
    if(document.body.dataset.preview==='true')return;
    // An old URL hash or intersection highlight can point to a different section.
    const panels=[...document.querySelectorAll('main>.panel')];
    const panel=panels.find(p=>p.getBoundingClientRect().bottom>innerHeight*.3);
    try{sessionStorage.setItem('portfolio-language-position',JSON.stringify({path:new URL(link.href).pathname,y:scrollY,id:panel?.id,top:panel?.getBoundingClientRect().top,time:Date.now()}));}catch{}
  });
  if(document.body.dataset.preview!=='true'){
    try{
      const saved=JSON.parse(sessionStorage.getItem('portfolio-language-position')||'null');
      if(saved?.path===location.pathname){
        sessionStorage.removeItem('portfolio-language-position');
        if(Date.now()-saved.time<30000){
          const restore=()=>{const panel=saved.id&&document.getElementById(saved.id);scrollTo({top:panel?scrollY+panel.getBoundingClientRect().top-saved.top:saved.y,behavior:'instant'});};
          restore();window.addEventListener('load',restore,{once:true});
        }
      }
    }catch{}
  }
  // Fit the element itself to the full image, so edge masks never land in letterboxing.
  const imageFrames = document.querySelectorAll('.bg-slide:not(video),.detail-image-frame,.album-image-frame');
  const fitImage = frame => {
    const img = frame.querySelector('img');
    if (!img?.naturalWidth || !frame.clientWidth || !frame.clientHeight) return;
    const ratio = img.naturalWidth / img.naturalHeight;
    const width = Math.min(frame.clientWidth, frame.clientHeight * ratio);
    img.style.setProperty('--fit-width', `${width / frame.clientWidth}`);
    img.style.setProperty('--fit-height', `${width / ratio / frame.clientHeight}`);
  };
  const imageFrameObserver = new ResizeObserver(entries => entries.forEach(({target}) => fitImage(target)));
  imageFrames.forEach(frame => {
    frame.querySelector('img')?.addEventListener('load', () => fitImage(frame));
    imageFrameObserver.observe(frame);
    fitImage(frame);
  });
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.dial-timeline').forEach(dial=>{
    const dates=[...dial.querySelectorAll('.dial-date')],panels=[...dial.querySelectorAll('.dial-content')];let current=0;
    const select=(i,focus=false)=>{current=Math.max(0,Math.min(dates.length-1,i));dates.forEach((d,n)=>{d.setAttribute('aria-selected',String(n===current));d.tabIndex=n===current?0:-1;panels[n].hidden=n!==current;});dial.style.setProperty('--angle',dates[current].dataset.angle+'deg');if(focus)dates[current].focus({preventScroll:true});};
    dates.forEach((d,i)=>{d.addEventListener('pointerenter',e=>{if(e.pointerType!=='touch')select(i);});d.addEventListener('focus',()=>select(i));d.addEventListener('click',()=>select(i));d.addEventListener('keydown',e=>{if(['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();select(e.key==='Home'?0:e.key==='End'?dates.length-1:i+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1),true);}});});
    dial.querySelector('[data-dial-prev]').onclick=()=>select(current-1,true);
    dial.querySelector('[data-dial-next]').onclick=()=>select(current+1,true);
    const fromHash=()=>{const n=dates.findIndex(d=>'#record-'+d.dataset.recordIndex===location.hash);select(n<0?0:n);};fromHash();window.addEventListener('hashchange',fromHash);
  });
  document.querySelectorAll('.life-album').forEach(album=>{
    const track=album.querySelector('.album-track'),slides=[...track.children],pause=album.querySelector('[data-album-pause]');
    let current=0,paused=reduceMotion,hover=false,visible=false,timer;
    const go=i=>{current=(i+slides.length)%slides.length;track.scrollTo({left:slides[current].offsetLeft,behavior:reduceMotion?'instant':'smooth'});};
    const schedule=()=>{clearInterval(timer);if(slides.length>1&&visible&&!paused&&!hover&&!document.hidden)timer=setInterval(()=>go(current+1),Math.max(3,Number(album.dataset.interval)||4)*1000);};
    track.addEventListener('scroll',()=>{current=slides.reduce((best,s,i)=>Math.abs(s.offsetLeft-track.scrollLeft)<Math.abs(slides[best].offsetLeft-track.scrollLeft)?i:best,0);album.querySelector('[data-album-count]').textContent=(current+1)+' / '+slides.length;});
    album.querySelector('[data-album-prev]').onclick=()=>{go(current-1);schedule();};album.querySelector('[data-album-next]').onclick=()=>{go(current+1);schedule();};
    const label=()=>{pause.textContent=paused?ui('Play','播放'):ui('Pause','暂停');pause.setAttribute('aria-pressed',String(paused));};pause.onclick=()=>{paused=!paused;label();schedule();};label();
    track.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){hover=true;schedule();}});track.addEventListener('pointerleave',()=>{hover=false;schedule();});
    track.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();go(current+(e.key==='ArrowRight'?1:-1));schedule();}});
    new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;schedule();},{threshold:.1}).observe(album);document.addEventListener('visibilitychange',schedule);
  });
  const menu = document.querySelector('.menu-toggle');
  menu?.addEventListener('click', () => {
    const open = document.querySelector('.nav-links').classList.toggle('open');
    menu.setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('.nav-links a').forEach(a => a.addEventListener('click', () => {
    document.querySelector('.nav-links').classList.remove('open'); menu?.setAttribute('aria-expanded', 'false');
  }));
  document.addEventListener('click',event=>{
    const a=event.target.closest('a');if(!a||a.target||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
    const url=new URL(a.href),here=new URL(document.baseURI);
    const samePage=document.body.dataset.preview==='true'
      ? document.querySelector('main>.panel')&&url.pathname===`/site/index${chinese?'.zh':''}.html`
      : url.origin===location.origin&&url.pathname===location.pathname;
    if(!samePage||url.origin!==here.origin||!url.hash)return;
    const target=document.getElementById(decodeURIComponent(url.hash.slice(1)));if(!target)return;
    event.preventDefault();event.stopImmediatePropagation();
    if(document.body.dataset.preview!=='true')history.replaceState(null,'',url.hash);
    target.scrollIntoView({behavior:'instant',block:'start'});
  });
  const observer = new IntersectionObserver(entries => entries.forEach(entry => {
    if (entry.isIntersecting) document.querySelectorAll('.nav-links a').forEach(a => a.classList.toggle('active', a.hash === '#' + entry.target.id));
  }), {threshold: .55});
  document.querySelectorAll('.panel').forEach(panel => {
    observer.observe(panel);
    const slides = [...panel.querySelectorAll('.bg-slide')];
    let current = 0, visible = false, paused = reduceMotion, timer,fadeTimer;
    const show = next => {
      current = (next + slides.length) % slides.length;
      clearTimeout(fadeTimer);
      slides.forEach((slide, i) => {
        slide.classList.toggle('leaving',slide.classList.contains('current')&&i!==current);
        slide.classList.toggle('current', i === current);
        const media=slide.matches('img,video')?slide:slide.querySelector('img,video');
        if (i === current && media?.dataset.src) {media.src = media.dataset.src; delete media.dataset.src;}
      });
      fadeTimer=setTimeout(()=>slides.forEach(slide=>slide.classList.remove('leaving')),reduceMotion?0:1250);
      const count = panel.querySelector('.slide-count');
      if (count) count.textContent = `${current + 1} / ${slides.length}`;
      const nextFrame=slides[(current+1)%slides.length],nextSlide=nextFrame?.matches('img')?nextFrame:nextFrame?.querySelector('img');
      if(nextSlide?.tagName==='IMG'&&nextSlide.dataset.src){nextSlide.src=nextSlide.dataset.src;delete nextSlide.dataset.src;}
    };
    const schedule = () => {
      clearInterval(timer);
      if (visible && !paused && !document.hidden && slides.length > 1)
        timer = setInterval(() => show(current + 1), Math.max(3, Number(panel.dataset.interval) || 6) * 1000);
    };
    panel.querySelector('[data-slide-prev]')?.addEventListener('click', () => {show(current - 1); schedule();});
    panel.querySelector('[data-slide-next]')?.addEventListener('click', () => {show(current + 1); schedule();});
    const pause = panel.querySelector('[data-slide-pause]');
    const pauseLabel = () => {if (pause) {pause.textContent = paused ? ui('Play','播放') : ui('Pause','暂停'); pause.setAttribute('aria-pressed', String(paused));pause.title=paused?'开始图片轮播':'自动轮播中';}};
    pause?.addEventListener('click', () => {paused = !paused; pauseLabel(); schedule();}); pauseLabel();
    new IntersectionObserver(entries => {
      visible = entries[0].isIntersecting;panel.classList.toggle('slides-offscreen',!visible); if(visible&&slides.length>1)show(current); schedule();
      panel.querySelectorAll('video[data-background]').forEach(v => {
        if (visible && !reduceMotion && !paused) {if(v.dataset.src){v.src=v.dataset.src;delete v.dataset.src;}v.play().catch(()=>{});} else v.pause();
      });
    }, {threshold: .1}).observe(panel);
    document.addEventListener('visibilitychange', schedule);
  });
  document.querySelectorAll('.timeline').forEach(timeline => {
    const nodes = [...timeline.querySelectorAll('.timeline-node')], panels = [...timeline.querySelectorAll('.timeline-detail')];
    let current = 0;
    function select(index, focus = false) {
      current = Math.max(0, Math.min(nodes.length - 1, index));
      nodes.forEach((node, i) => {node.setAttribute('aria-selected', String(i === current));node.tabIndex = i === current ? 0 : -1;panels[i].hidden = i !== current;});
      const rail = timeline.querySelector('.timeline-rail');
      rail.scrollTo({left: nodes[current].offsetLeft - rail.offsetLeft - 20, behavior: reduceMotion ? 'instant' : 'smooth'});
      if (focus) nodes[current].focus({preventScroll:true});
    }
    nodes.forEach((node, i) => node.addEventListener('click', () => select(i)));
    timeline.querySelector('[data-time-prev]').addEventListener('click', () => select(current - 1, true));
    timeline.querySelector('[data-time-next]').addEventListener('click', () => select(current + 1, true));
    timeline.addEventListener('keydown', e => {
      if (e.target.classList.contains('timeline-node') && ['ArrowLeft','ArrowRight','Home','End'].includes(e.key)) {
        e.preventDefault(); select(e.key==='Home'?0:e.key==='End'?nodes.length-1:current+(e.key==='ArrowRight'?1:-1), true);
      }
    });
  });
  const dialog = document.querySelector('.video-dialog');
  document.querySelectorAll('[data-open-video]').forEach(button => button.addEventListener('click', () => {
    const v = dialog.querySelector('video'); v.src = button.dataset.video; v.setAttribute('aria-label', button.dataset.title); dialog.showModal();
  }));
  dialog?.querySelector('.dialog-close').addEventListener('click', () => dialog.close());
  dialog?.addEventListener('close', () => {const v=dialog.querySelector('video');v.pause();v.removeAttribute('src');v.load();});
  document.querySelectorAll('video[data-player]').forEach(v => v.addEventListener('play', () => {if(v.dataset.src){v.src=v.dataset.src;delete v.dataset.src;v.play().catch(()=>{});}}, {once:true}));
  document.querySelectorAll('[data-load-video]').forEach(b => b.addEventListener('click', () => {
    const v=b.previousElementSibling;v.src=v.dataset.src;delete v.dataset.src;v.load();b.hidden=true;v.focus();
  }));
  const reader = document.querySelector('[data-reader]');
  if (reader) {
    const pages=JSON.parse(reader.dataset.pages), image=reader.querySelector('img'); let page=0, zoom=100;
    const show=()=>{image.src=pages[page];image.alt=`Document page ${page+1} of ${pages.length}`;image.style.width=zoom+'%';reader.querySelector('[data-page-count]').textContent=`${page+1} / ${pages.length}`;reader.querySelector('[data-page-prev]').disabled=page===0;reader.querySelector('[data-page-next]').disabled=page===pages.length-1;};
    reader.querySelector('[data-page-prev]').onclick=()=>{page=Math.max(0,page-1);show();};
    reader.querySelector('[data-page-next]').onclick=()=>{page=Math.min(pages.length-1,page+1);show();};
    reader.querySelector('[data-zoom-in]').onclick=()=>{zoom=Math.min(250,zoom+25);show();};
    reader.querySelector('[data-zoom-out]').onclick=()=>{zoom=Math.max(75,zoom-25);show();};
    reader.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){page=Math.min(pages.length-1,page+1);show();}if(e.key==='ArrowLeft'){page=Math.max(0,page-1);show();}}); show();
  }
  if (document.body.dataset.preview === 'true') document.addEventListener('click', e => {
    const origin=new URL(document.baseURI).origin;
    const a=e.target.closest('a'); if (!a || a.target==='_blank' || a.origin!==origin) return;
    const target=new URL(a.href);
    if(target.pathname.startsWith('/site/') && target.pathname.endsWith('.html')) {
      e.preventDefault(); parent.postMessage({type:'portfolio-preview-page',page:target.pathname.slice(6),hash:target.hash,preserveScroll:!!a.matches('[data-language-switch]')},origin);
    }
  });
})();
