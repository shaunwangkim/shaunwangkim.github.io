连接材料研究与工业制造的桥梁</h1><p class="detail-intro">混合制造——开发电弧金属增减材制造设备、基于光纤的结构健康监测技术，以及利用材料挤出式3D打印实现光纤集成的新方法。相关研究涵盖从金属到复合材料的多种材料，包括碳纤维增强复合材料（CFRP）层合板制造和金属3D打印。此外，还研究复合材料的耐久性及其结构健康监测，以提高储氢安全性。</p><div class="detail-block section-albums"><h2>图片</h2><section class="detail-album"><h3>实验与研究</h3><div class="detail-block"><section class="gallery-category"><div class="detail-gallery"><figure><div class="detail-image-frame"><img decoding="async" loading="lazy" srcset="assets/previews/45dcbe364e325caef2eb629a-640.webp 640w, assets/previews/45dcbe364e325caef2eb629a-1280.webp 1280w" sizes="(max-width: 600px) 100vw, 70vw" src="assets/previews/45dcbe364e325caef2eb629a-1280.webp" alt="Optical fibre fire detection experiment"></div><figcaption>光纤火灾探测实验<a class="gallery-original" href="assets/images/sections/01/01.png" target="_blank" rel="noopener">查看原图 ↗</a></figcaption></figure><figure><div class="detail-image-frame"><img decoding="async" loading="lazy" srcset="assets/previews/d40dfaf93d2227770bebf6c8-1280.webp 426w" sizes="(max-width: 600px) 100vw, 70vw" src="assets/previews/d40dfaf93d2227770bebf6c8-1280.webp" alt="Local heating detection experiment"></div><figcaption>局部加热探测实验<a class="gallery-original" href="assets/images/sections/01/02.png" target="_blank" rel="noopener">查看原图 ↗</a></figcaption></figure></div></section></div></section><section class="detail-album"><h3>基于光纤网络的结构监测</h3><div class="detail-block"><section class="gallery-category"><div class="detail-gallery"><figure><div class="detail-image-frame"><img decoding="async" loading="lazy" srcset="assets/previews/fc71be1894b121bb5495031c-640.webp 640w, assets/previews/fc71be1894b121bb5495031c-1280.webp 1280w" sizes="(max-width: 600px) 100vw, 70vw" src="assets/previews/fc71be1894b121bb5495031c-1280.webp" alt="Research image"></div><figcaption><a class="gallery-original" href="assets/images/sections/01/03.png" target="_blank" rel="noopener">查看原图 ↗</a></figcaption></figure></div></section></div></section><section class="detail-album
